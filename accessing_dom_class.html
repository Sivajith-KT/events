<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>accessing dom using class name</h1>
    <p>here the dom is accessing using class name</p>
    <p class="person">rahul</p>
    <p class="person">raju</p>

    <script>
        const persons=document.getElementsByClassName('person')
        console.log(persons)
        console.log(persons[0].innerHTML)
        console.log(persons[1].innerHTML)
    </script>
</body>
</html>
