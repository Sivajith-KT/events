<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p id="para1">this is a paragraph</p>

        console.log(p_tag)
        p_tag.innerText="this content is added using javascript"
